<svg viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tw-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2AB0A8"/>
      <stop offset="100%" stop-color="#15726C"/>
    </linearGradient>
    <pattern id="tw-studs" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="5" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <rect width="500" height="380" fill="url(#tw-bg)"/>
  <rect width="500" height="380" fill="url(#tw-studs)"/>

  <ellipse cx="250" cy="332" rx="165" ry="20" fill="rgba(0,0,0,0.18)"/>

  <!-- flowers behind -->
  <g stroke="#2f8f3a" stroke-width="7" stroke-linecap="round">
    <line x1="98" y1="322" x2="102" y2="250"/>
    <line x1="404" y1="326" x2="398" y2="262"/>
  </g>
  <g fill="#3aa94a">
    <ellipse cx="118" cy="292" rx="16" ry="9" transform="rotate(28 118 292)"/>
    <ellipse cx="382" cy="300" rx="15" ry="9" transform="rotate(-26 382 300)"/>
  </g>
  <!-- left flower -->
  <g>
    <circle cx="102" cy="234" r="15" fill="#ff7eb0"/><circle cx="82" cy="248" r="15" fill="#ff7eb0"/>
    <circle cx="122" cy="248" r="15" fill="#ff7eb0"/><circle cx="90" cy="270" r="15" fill="#ff7eb0"/>
    <circle cx="114" cy="270" r="15" fill="#ff7eb0"/><circle cx="102" cy="253" r="12" fill="#ffd23f"/>
  </g>
  <!-- right flower -->
  <g>
    <circle cx="398" cy="246" r="14" fill="#ff9a3c"/><circle cx="380" cy="259" r="14" fill="#ff9a3c"/>
    <circle cx="416" cy="259" r="14" fill="#ff9a3c"/><circle cx="387" cy="279" r="14" fill="#ff9a3c"/>
    <circle cx="409" cy="279" r="14" fill="#ff9a3c"/><circle cx="398" cy="263" r="11" fill="#fff1c2"/>
  </g>

  <!-- paper -->
  <rect x="212" y="80" width="76" height="86" rx="3" fill="#fff8ef"/>
  <g stroke="#c9bda8" stroke-width="3" stroke-linecap="round">
    <line x1="224" y1="100" x2="276" y2="100"/><line x1="224" y1="114" x2="276" y2="114"/>
    <line x1="224" y1="128" x2="262" y2="128"/>
  </g>
  <text x="250" y="150" font-family="'Baloo 2',sans-serif" font-size="15" fill="#e05fa0" text-anchor="middle">✿</text>

  <!-- typewriter body -->
  <rect x="150" y="248" width="200" height="74" rx="16" fill="#0f6a64"/>
  <polygon points="164,258 196,206 304,206 336,258" fill="#1f978f"/>
  <rect x="188" y="150" width="124" height="66" rx="8" fill="#12817a"/>
  <rect x="178" y="140" width="144" height="26" rx="13" fill="#0b524d"/>
  <circle cx="178" cy="153" r="15" fill="#c0392b"/><circle cx="322" cy="153" r="15" fill="#c0392b"/>
  <circle cx="178" cy="153" r="6" fill="#8e2b22"/><circle cx="322" cy="153" r="6" fill="#8e2b22"/>

  <!-- keys -->
  <g fill="#f3ead9" stroke="#c9bda8" stroke-width="1.5">
    <circle cx="196" cy="226" r="8"/><circle cx="218" cy="224" r="8"/><circle cx="240" cy="223" r="8"/>
    <circle cx="262" cy="223" r="8"/><circle cx="284" cy="224" r="8"/><circle cx="306" cy="226" r="8"/>
    <circle cx="206" cy="244" r="8"/><circle cx="228" cy="243" r="8"/><circle cx="250" cy="242" r="8"/>
    <circle cx="272" cy="243" r="8"/><circle cx="294" cy="244" r="8"/>
  </g>
  <rect x="206" y="258" width="88" height="12" rx="6" fill="#f3ead9" stroke="#c9bda8" stroke-width="1.5"/>

  <!-- badges -->
  <rect x="20" y="20" width="104" height="34" rx="17" fill="#FFD23F"/>
  <text x="72" y="43" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="17" fill="#1b3a5c" text-anchor="middle">3-in-1</text>
  <text x="480" y="46" font-family="'Baloo 2',sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="end" opacity="0.95">#31169</text>
</svg>

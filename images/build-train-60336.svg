  <polygon points="225,276 295,276 285,290 235,290" fill="#AA1A0A"/>
  <!-- Wheels -->
  <circle cx="75"  cy="292" r="28" fill="#333"/>
  <circle cx="75"  cy="292" r="20" fill="#444"/>
  <circle cx="75"  cy="292" r="10" fill="#888"/>
  <circle cx="75"  cy="292" r="5"  fill="#CCC"/>
  <circle cx="155" cy="292" r="28" fill="#333"/>
  <circle cx="155" cy="292" r="20" fill="#444"/>
  <circle cx="155" cy="292" r="10" fill="#888"/>
  <circle cx="155" cy="292" r="5"  fill="#CCC"/>
  <circle cx="240" cy="292" r="22" fill="#333"/>
  <circle cx="240" cy="292" r="16" fill="#444"/>
  <circle cx="240" cy="292" r="8"  fill="#888"/>
  <circle cx="240" cy="292" r="4"  fill="#CCC"/>

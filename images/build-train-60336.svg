  <rect x="306" y="216" width="170" height="74" rx="12" fill="#FFD700"/>
  <!-- Windows -->
  <rect x="322" y="228" width="34" height="28" rx="5" fill="#AADDFF" opacity="0.9"/>
  <rect x="365" y="228" width="34" height="28" rx="5" fill="#AADDFF" opacity="0.9"/>
  <rect x="408" y="228" width="34" height="28" rx="5" fill="#AADDFF" opacity="0.9"/>
  <!-- Window frames -->
  <rect x="322" y="228" width="34" height="28" rx="5" fill="none" stroke="#CC9900" stroke-width="2"/>
  <rect x="365" y="228" width="34" height="28" rx="5" fill="none" stroke="#CC9900" stroke-width="2"/>
  <rect x="408" y="228" width="34" height="28" rx="5" fill="none" stroke="#CC9900" stroke-width="2"/>
  <!-- LEGO studs on car roof -->
  <circle cx="320" cy="222" r="6" fill="#CCAA00"/>
  <circle cx="338" cy="222" r="6" fill="#CCAA00"/>
  <circle cx="356" cy="222" r="6" fill="#CCAA00"/>
  <circle cx="374" cy="222" r="6" fill="#CCAA00"/>
  <circle cx="392" cy="222" r="6" fill="#CCAA00"/>
  <circle cx="410" cy="222" r="6" fill="#CCAA00"/>
  <circle cx="428" cy="222" r="6" fill="#CCAA00"/>
  <circle cx="446" cy="222" r="6" fill="#CCAA00"/>
  <circle cx="464" cy="222" r="6" fill="#CCAA00"/>
  <!-- Car wheels -->
  <circle cx="340" cy="292" r="22" fill="#333"/>
  <circle cx="340" cy="292" r="15" fill="#444"/>
  <circle cx="340" cy="292" r="7"  fill="#888"/>
  <circle cx="450" cy="292" r="22" fill="#333"/>
  <circle cx="450" cy="292" r="15" fill="#444"/>
  <circle cx="450" cy="292" r="7"  fill="#888"/>
  <!-- Coupling -->
  <rect x="295" y="286" width="14" height="10" rx="3" fill="#666"/>
  <rect x="303" y="288" width="6" height="6" rx="1" fill="#888"/>
  <!-- Theme badge -->
  <rect x="12" y="12" width="130" height="34" rx="17" fill="rgba(0,0,0,0.65)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="77" y="34" font-family="Arial Black,Arial,sans-serif" font-size="12" fill="white" text-anchor="middle" font-weight="900">🚂 CITY</text>
  <!-- Pieces badge -->
  <rect x="358" y="12" width="130" height="34" rx="17" fill="#E03020"/>
  <text x="423" y="34" font-family="Arial Black,Arial,sans-serif" font-size="13" fill="white" text-anchor="middle" font-weight="900">🧩 677 Pieces</text>
</svg>
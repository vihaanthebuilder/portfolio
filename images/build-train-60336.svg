<svg viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6BB8E8"/>
      <stop offset="60%" stop-color="#9DD4F4"/>
      <stop offset="100%" stop-color="#C8E8F8"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A9A30"/>
      <stop offset="100%" stop-color="#3A7A18"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFEE44"/>
      <stop offset="60%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#FFAA00" stop-opacity="0"/>
    </radialGradient>
    <pattern id="studs" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="5" fill="rgba(255,255,255,0.1)"/>
    </pattern>
  </defs>
  <!-- Sky -->
  <rect width="500" height="380" fill="url(#sky)"/>
  <rect width="500" height="380" fill="url(#studs)"/>
  <!-- Sun -->
  <circle cx="420" cy="60" r="45" fill="url(#sun)"/>
  <circle cx="420" cy="60" r="30" fill="#FFE030"/>
  <!-- Clouds -->
  <ellipse cx="100" cy="70" rx="50" ry="22" fill="white" opacity="0.9"/>
  <ellipse cx="80" cy="75" rx="30" ry="20" fill="white" opacity="0.9"/>
  <ellipse cx="125" cy="75" rx="35" ry="18" fill="white" opacity="0.9"/>
  <ellipse cx="300" cy="55" rx="45" ry="20" fill="white" opacity="0.85"/>
  <ellipse cx="278" cy="62" rx="28" ry="18" fill="white" opacity="0.85"/>

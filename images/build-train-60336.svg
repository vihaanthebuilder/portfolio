  <rect x="41"  y="292" width="24" height="28" rx="3" fill="#7A5C34"/>
  <rect x="77"  y="292" width="24" height="28" rx="3" fill="#8B6840"/>
  <rect x="113" y="292" width="24" height="28" rx="3" fill="#7A5C34"/>
  <rect x="149" y="292" width="24" height="28" rx="3" fill="#8B6840"/>
  <rect x="185" y="292" width="24" height="28" rx="3" fill="#7A5C34"/>
  <rect x="221" y="292" width="24" height="28" rx="3" fill="#8B6840"/>
  <rect x="257" y="292" width="24" height="28" rx="3" fill="#7A5C34"/>
  <rect x="293" y="292" width="24" height="28" rx="3" fill="#8B6840"/>
  <rect x="329" y="292" width="24" height="28" rx="3" fill="#7A5C34"/>
  <rect x="365" y="292" width="24" height="28" rx="3" fill="#8B6840"/>
  <rect x="401" y="292" width="24" height="28" rx="3" fill="#7A5C34"/>
  <rect x="437" y="292" width="24" height="28" rx="3" fill="#8B6840"/>
  <rect x="473" y="292" width="24" height="28" rx="3" fill="#7A5C34"/>

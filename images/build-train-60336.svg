  <ellipse cx="400" cy="340" rx="140" ry="55" fill="#4A8A25"/>
  <rect y="310" width="500" height="70" fill="url(#ground)"/>
  <!-- Railway Ballast -->
  <rect y="296" width="500" height="20" rx="0" fill="#B8A888"/>
  <!-- Railway Ties (sleepers) -->

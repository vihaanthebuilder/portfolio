  <circle cx="75"  cy="207" r="7" fill="#C02010"/>
  <circle cx="95"  cy="207" r="7" fill="#C02010"/>
  <circle cx="115" cy="207" r="7" fill="#C02010"/>
  <circle cx="135" cy="207" r="7" fill="#C02010"/>

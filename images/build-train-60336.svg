  <circle cx="175" cy="207" r="7" fill="#C02010"/>
  <circle cx="195" cy="207" r="7" fill="#C02010"/>
  <circle cx="215" cy="207" r="7" fill="#C02010"/>
  <!-- Cab window area -->
  <rect x="150" y="215" width="70" height="55" rx="8" fill="#E03020"/>
  <rect x="158" y="222" width="54" height="42" rx="6" fill="#AADDFF" opacity="0.85"/>

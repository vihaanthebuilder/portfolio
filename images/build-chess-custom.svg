<svg viewBox="0 0 500 380" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1E3A"/>
      <stop offset="100%" stop-color="#162E52"/>
    </linearGradient>
    <radialGradient id="boardGlow" cx="50%" cy="55%" r="45%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFD700" stop-opacity="0"/>
    </radialGradient>
    <pattern id="studs" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="5" fill="rgba(255,255,255,0.06)"/>
    </pattern>
  </defs>
  <!-- Background -->
  <rect width="500" height="380" fill="url(#bg)"/>
